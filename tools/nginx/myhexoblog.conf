# Nginx 站点配置示例，可放到 /etc/nginx/conf.d/myhexoblog.conf。
# 改完执行 nginx -t 校验，再 systemctl reload nginx 生效。
#
# 要点：
# - root 指向部署目录的 current 软链，发布时只切换软链，站点不会中断
# - 静态资源设置较长缓存，HTML 不设缓存，保证更新能立刻看到
# - HTTPS 证书用 certbot 申请，它会自动补全 443 相关配置

server {
    listen 80;
    listen [::]:80;

    # 换成你自己的域名
    server_name your-domain.example.com;

    root /var/www/myhexoblog/current;
    index index.html;

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
